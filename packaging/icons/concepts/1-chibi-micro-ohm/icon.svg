<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Original chibi micro-ohm mark: a puffy Ω gate on torii-style bases with a gold µ under
       its arch, in the same Fluent Emoji colours as the harness-mgr torii -->
  <defs>
    <linearGradient id="ohm" gradientUnits="userSpaceOnUse" x1="110" y1="0" x2="914" y2="0">
      <stop offset="0" stop-color="#D83C16"/>
      <stop offset="0.3" stop-color="#FF8D3A"/>
      <stop offset="0.7" stop-color="#FF7A42"/>
      <stop offset="1" stop-color="#C04731"/>
    </linearGradient>
    <linearGradient id="ohmShade" gradientUnits="userSpaceOnUse" x1="0" y1="380" x2="0" y2="860">
      <stop offset="0" stop-color="#ED2A3E" stop-opacity="0"/>
      <stop offset="1" stop-color="#ED2A3E" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="400" y1="0" x2="650" y2="0">
      <stop offset="0" stop-color="#B7791F"/>
      <stop offset="0.35" stop-color="#FFD966"/>
      <stop offset="0.6" stop-color="#F4B83A"/>
      <stop offset="1" stop-color="#9C5F12"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E5D7E"/>
      <stop offset="1" stop-color="#29272C"/>
    </linearGradient>
  </defs>

  <!-- Ω: depth, body, shade -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="124">
    <path d="M330 800 C330 752 395 722 346 688 A290 290 0 1 1 678 688 C629 722 694 752 694 800"
          stroke="#8E2A1C" transform="translate(0 18)"/>
    <path d="M330 800 C330 752 395 722 346 688 A290 290 0 1 1 678 688 C629 722 694 752 694 800" stroke="url(#ohm)"/>
    <path d="M330 800 C330 752 395 722 346 688 A290 290 0 1 1 678 688 C629 722 694 752 694 800" stroke="url(#ohmShade)"/>
    <!-- soft side highlight, like the torii pillars -->
    <path d="M242 400 A290 290 0 0 0 262 560" stroke="#ffffff" stroke-opacity="0.26" stroke-width="22"/>
    <!-- gloss along the top of the arch -->
    <path d="M300 300 A290 290 0 0 1 724 300" stroke="#ffffff" stroke-opacity="0.42" stroke-width="30" transform="translate(0 -34)"/>
  </g>

  <!-- plum bases under the feet -->
  <rect x="112" y="776" width="320" height="104" rx="48" fill="url(#base)"/>
  <rect x="592" y="776" width="320" height="104" rx="48" fill="url(#base)"/>
  <rect x="144" y="788" width="190" height="22" rx="11" fill="#ffffff" opacity="0.18"/>
  <rect x="624" y="788" width="190" height="22" rx="11" fill="#ffffff" opacity="0.18"/>

  <!-- µ: depth, body, gloss -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="70">
    <g stroke="#7A4A0E" transform="translate(0 12)">
      <path d="M452 360 V680"/>
      <path d="M452 470 C452 590 584 590 584 470"/>
      <path d="M584 360 V556"/>
    </g>
    <g stroke="url(#gold)">
      <path d="M452 360 V680"/>
      <path d="M452 470 C452 590 584 590 584 470"/>
      <path d="M584 360 V556"/>
    </g>
    <path d="M440 372 V430" stroke="#ffffff" stroke-opacity="0.5" stroke-width="16"/>
    <path d="M572 372 V430" stroke="#ffffff" stroke-opacity="0.5" stroke-width="16"/>
  </g>
</svg>
